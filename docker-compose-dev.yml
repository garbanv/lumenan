services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: analytics
    ports:
      - '5432:5432'  
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d analytics']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: applies db/schema.sql, then exits. Runs automatically before
  # `app` starts (see depends_on) and can be re-run by hand with:
  #   docker compose run --rm migrate
  migrate:
    build: .
    # Exits by design; stops Coolify from reporting it as unhealthy.
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/analytics
    command: ['node', 'db/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:

        NEXT_PUBLIC_APP_ORIGIN: ${NEXT_PUBLIC_APP_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/analytics
      VISITOR_SALT: ${VISITOR_SALT}
      NEXT_PUBLIC_APP_ORIGIN: ${NEXT_PUBLIC_APP_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    ports:
      - '3000:3000'
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data: